<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calcul de garde</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --accent: #0E6E6E; --accent-soft: #E1EFEE; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    min-height: 100%;
    background: #E9EDED;
    display: flex;
    justify-content: center;
    padding: 20px 14px 40px;
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    color: #17252A;
    -webkit-font-smoothing: antialiased;
  }
  .cg-card { width: 100%; max-width: 430px; }
  .cg-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 18px;
  }
  .cg-title { font-size: 15px; font-weight: 600; letter-spacing: 0.02em; }
  .cg-formula { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #5C6B70; }

  .cg-panel {
    background: #FFFFFF;
    border: 1px solid #D6DEDE;
    border-radius: 14px;
    padding: 18px 16px;
    margin-bottom: 12px;
  }
  .cg-flabel {
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.09em; color: #6A7A7E; margin-bottom: 10px;
  }

  .cg-xrow { display: flex; align-items: stretch; gap: 8px; }
  .cg-step {
    width: 46px;
    border: 1px solid #D6DEDE;
    background: #F4F7F7;
    border-radius: 10px;
    font-size: 22px; font-weight: 500; color: #37474C;
    cursor: pointer; transition: background .12s;
  }
  .cg-step:active { background: #E4EBEB; }
  .cg-input {
    flex: 1; min-width: 0; text-align: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 30px; font-weight: 500;
    border: 1px solid #D6DEDE; border-radius: 10px;
    padding: 6px 4px; color: #17252A; outline: none;
    transition: border-color .12s;
  }
  .cg-input:focus { border-color: var(--accent); }

  .cg-seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .cg-seg-btn {
    border: 1px solid #D6DEDE; background: #FFFFFF; border-radius: 10px;
    padding: 13px 0; font-family: 'IBM Plex Mono', monospace;
    font-size: 15px; font-weight: 500; color: #37474C;
    cursor: pointer; transition: all .12s;
  }
  .cg-seg-btn.on { background: var(--accent); border-color: var(--accent); color: #FFFFFF; }

  .cg-toggle-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .cg-toggle-txt .t1 { font-size: 14px; font-weight: 600; }
  .cg-toggle-txt .t2 { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #6A7A7E; }
  .cg-switch {
    position: relative; width: 52px; height: 30px; border-radius: 999px;
    border: none; cursor: pointer; background: #C4CFCF;
    transition: background .15s; flex-shrink: 0;
  }
  .cg-switch.on { background: var(--accent); }
  .cg-knob {
    position: absolute; top: 3px; left: 3px; width: 24px; height: 24px;
    border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,.25);
    transform: translateX(0); transition: transform .15s;
  }
  .cg-switch.on .cg-knob { transform: translateX(22px); }

  .cg-result {
    background: var(--accent-soft);
    border: 1px solid color-mix(in srgb, var(--accent) 20%, #FFFFFF);
    border-radius: 14px; padding: 20px 18px 18px; margin-bottom: 12px; text-align: center;
  }
  .cg-result .rlabel {
    font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600;
    letter-spacing: 0.06em; color: var(--accent); margin-bottom: 4px;
  }
  .cg-result .rval {
    font-family: 'IBM Plex Mono', monospace; font-size: 46px; font-weight: 600;
    line-height: 1.05; color: #17252A; letter-spacing: -0.01em;
  }
  .cg-result .rval .eur { font-size: 24px; color: #55666B; margin-left: 4px; }

  .cg-detail { padding: 6px 2px 0; }
  .cg-drow {
    display: flex; justify-content: space-between; font-size: 13px;
    padding: 7px 0; border-bottom: 1px solid #E4EAEA;
  }
  .cg-drow:last-child { border-bottom: none; }
  .cg-drow .k { color: #6A7A7E; }
  .cg-drow .v { font-family: 'IBM Plex Mono', monospace; font-weight: 500; }

  .cg-ref { margin-top: 2px; }
  .cg-ref-title {
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.09em; color: #6A7A7E; margin-bottom: 8px;
  }
  .cg-ref-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .cg-ref-cell {
    border: 1px solid #E0E7E7; border-radius: 10px; padding: 10px 3px;
    text-align: center; cursor: pointer;
  }
  .cg-ref-cell .h { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #6A7A7E; }
  .cg-ref-cell .m { font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 600; margin-top: 3px; }
  .cg-ref-cell.active { border-color: var(--accent); background: var(--accent-soft); }
</style>
</head>
<body>
  <div class="cg-card">
    <div class="cg-head">
      <span class="cg-title">Calcul de garde</span>
      <span class="cg-formula">Sh = Affich &times; 0,77</span>
    </div>

    <div class="cg-panel">
      <div class="cg-flabel">Affich</div>
      <div class="cg-xrow">
        <button class="cg-step" id="stepDown" aria-label="Diminuer de 0,5">&minus;</button>
        <input class="cg-input" id="affich" inputmode="decimal" value="24,6" placeholder="0">
        <button class="cg-step" id="stepUp" aria-label="Augmenter de 0,5">+</button>
      </div>
    </div>

    <div class="cg-panel">
      <div class="cg-flabel">Durée de garde</div>
      <div class="cg-seg" id="seg"></div>
    </div>

    <div class="cg-panel">
      <div class="cg-toggle-row">
        <div class="cg-toggle-txt">
          <div class="t1">Reprise d'ancienneté</div>
          <div class="t2">AW &middot; Affich &times; 1,09</div>
        </div>
        <button class="cg-switch" id="awSwitch" role="switch" aria-checked="false" aria-label="Reprise d'ancienneté">
          <span class="cg-knob"></span>
        </button>
      </div>
    </div>

    <div class="cg-result">
      <div class="rlabel" id="rlabel">J10h</div>
      <div class="rval" id="rval">&mdash;</div>
    </div>

    <div class="cg-panel">
      <div class="cg-detail">
        <div class="cg-drow">
          <span class="k" id="kEff">Affich utilis&eacute;</span>
          <span class="v" id="vEff">&mdash;</span>
        </div>
        <div class="cg-drow">
          <span class="k">Sh (taux horaire)</span>
          <span class="v" id="vSh">&mdash;</span>
        </div>
      </div>
    </div>

    <div class="cg-ref">
      <div class="cg-ref-title" id="refTitle">Toutes dur&eacute;es (sans AW)</div>
      <div class="cg-ref-grid" id="refGrid"></div>
    </div>
  </div>

<script>
(function () {
  var SHIFTS = [7, 10, 11, 12];
  var state = { affich: "24,6", hours: 10, aw: false };

  var $ = function (id) { return document.getElementById(id); };

  function fmt(n) {
    return isNaN(n) ? "\u2014" : n.toLocaleString("fr-FR", {
      minimumFractionDigits: 2, maximumFractionDigits: 2
    });
  }

  // Build segmented control
  var seg = $("seg");
  SHIFTS.forEach(function (h) {
    var b = document.createElement("button");
    b.className = "cg-seg-btn";
    b.textContent = h + " h";
    b.setAttribute("data-h", h);
    b.addEventListener("click", function () { state.hours = h; render(); });
    seg.appendChild(b);
  });

  // Build reference grid
  var refGrid = $("refGrid");
  SHIFTS.forEach(function (h) {
    var cell = document.createElement("div");
    cell.className = "cg-ref-cell";
    cell.setAttribute("data-h", h);
    cell.innerHTML = '<div class="h"></div><div class="m"></div>';
    cell.addEventListener("click", function () { state.hours = h; render(); });
    refGrid.appendChild(cell);
  });

  function render() {
    var accent     = state.aw ? "#B4741A" : "#0E6E6E";
    var accentSoft = state.aw ? "#F6ECD9" : "#E1EFEE";
    document.documentElement.style.setProperty("--accent", accent);
    document.documentElement.style.setProperty("--accent-soft", accentSoft);

    var aNum   = parseFloat(String(state.affich).replace(",", "."));
    var valid  = !isNaN(aNum);
    var factor = state.aw ? 1.09 : 1;
    var affichEff = aNum * factor;
    var sh = affichEff * 0.77;
    var j  = sh * state.hours;
    var suffix = state.aw ? "AW" : "";

    $("rlabel").textContent = "J" + state.hours + "h" + suffix;
    $("rval").innerHTML = fmt(j) + '<span class="eur"> \u20AC</span>';
    $("kEff").textContent = "Affich" + (state.aw ? " \u00D7 1,09" : "") + " utilis\u00E9";
    $("vEff").textContent = fmt(affichEff);
    $("vSh").textContent  = fmt(sh) + " \u20AC";
    $("refTitle").textContent = "Toutes dur\u00E9es " + (state.aw ? "(avec AW)" : "(sans AW)");

    // Segmented control state
    seg.querySelectorAll(".cg-seg-btn").forEach(function (b) {
      b.classList.toggle("on", parseInt(b.getAttribute("data-h"), 10) === state.hours);
    });

    // AW switch
    var sw = $("awSwitch");
    sw.classList.toggle("on", state.aw);
    sw.setAttribute("aria-checked", state.aw ? "true" : "false");

    // Reference cells
    refGrid.querySelectorAll(".cg-ref-cell").forEach(function (cell) {
      var h = parseInt(cell.getAttribute("data-h"), 10);
      cell.querySelector(".h").textContent = "J" + h + "h" + suffix;
      cell.querySelector(".m").textContent = fmt(sh * h);
      cell.classList.toggle("active", h === state.hours);
    });
  }

  // Input handling
  var input = $("affich");
  input.addEventListener("input", function (e) {
    var cleaned = e.target.value.replace(/[^0-9.,]/g, "");
    e.target.value = cleaned;
    state.affich = cleaned;
    render();
  });

  function step(d) {
    var base = parseFloat(String(state.affich).replace(",", "."));
    if (isNaN(base)) base = 0;
    var next = Math.round((base + d) * 100) / 100;
    state.affich = String(next).replace(".", ",");
    input.value = state.affich;
    render();
  }
  $("stepDown").addEventListener("click", function () { step(-0.5); });
  $("stepUp").addEventListener("click", function () { step(0.5); });

  $("awSwitch").addEventListener("click", function () { state.aw = !state.aw; render(); });

  render();
})();
</script>
</body>
</html>
